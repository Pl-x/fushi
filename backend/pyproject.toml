[project]
name = "backend"
version = "0.1.0"
description = "Payment processing backend with Paystack integration"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.0.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-migrate>=4.0.5",
    "flask-cors>=4.0.0",
    "flask-limiter>=3.5.0",
    "pypaystack2>=1.0.0",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.2",
    "requests>=2.31.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
    "pytest-xdist>=3.3.1",
    "coverage>=7.2.0",
]

dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
