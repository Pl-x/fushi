[project]
name = "backend"
version = "0.1.0"
description = "Payment processing backend with Paystack integration"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "flask-migrate>=4.1.0",
    "flask-cors>=6.0.2",
    "flask-limiter>=4.1.1",
    "python-dotenv>=1.2.2",
    "psycopg2-binary>=2.9.11",
    "redis>=7.2.0",
    "pyjwt>=2.12.1",
    "bcrypt>=5.0.0",
    "requests>=2.32.5",
    "gunicorn>=23.0.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
    "pytest-xdist>=3.3.1",
    "coverage>=7.2.0",
]

dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
