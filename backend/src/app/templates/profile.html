<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>Let's Review — Profile</title></head><body class="bg-gray-50 font-sans text-gray-900"><main class="mx-auto max-w-md p-5"><a href="/dashboard" class="text-sm font-semibold text-emerald-700">← Dashboard</a><h1 class="mt-6 text-3xl font-bold">Your profile</h1><p class="mt-1 text-sm text-gray-500">Your payout and reviewer details.</p><form id="form" class="mt-6 space-y-4 rounded-2xl border bg-white p-5 shadow-sm"><label class="block text-sm font-semibold">Name<input name="name" class="mt-1 w-full rounded-xl border p-3"></label><label class="block text-sm font-semibold">Reviewer username<input name="username" class="mt-1 w-full rounded-xl border p-3"></label><label class="block text-sm font-semibold">Location<input name="location" class="mt-1 w-full rounded-xl border p-3"></label><label class="block text-sm font-semibold">M-Pesa phone<input name="phone_number" class="mt-1 w-full rounded-xl border p-3" placeholder="2547XXXXXXXX"></label><button class="w-full rounded-xl bg-gray-900 p-3 font-semibold text-white">Save profile</button><p id="message" class="text-sm text-emerald-700"></p></form><div class="mt-5 grid grid-cols-2 gap-3"><a href="/reviews" class="rounded-xl border bg-white p-4 font-semibold">View reviews →</a><a href="/deposit" class="rounded-xl border bg-white p-4 font-semibold">Deposit credits →</a></div></main><script>const t=localStorage.getItem('pinkToken'),f=document.querySelector('#form');if(!t)location='/signin';fetch('/api/v1/portal/me',{headers:{Authorization:`Bearer ${t}`}}).then(r=>r.json()).then(p=>{const d=p.data;['name','phone_number'].forEach(k=>f[k].value=d.user[k]||'');['username','location'].forEach(k=>f[k].value=d.profile[k]||'')});f.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/v1/portal/me',{method:'PATCH',headers:{Authorization:`Bearer ${t}`,'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});document.querySelector('#message').textContent=(await r.json()).status==='success'?'Profile saved.':'Unable to save profile.'}</script></body></html>
