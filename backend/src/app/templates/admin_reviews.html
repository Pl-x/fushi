<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Let's Review — Reviewed hotels</title></head><body class="bg-slate-50 text-slate-900"><main class="mx-auto max-w-5xl p-5"><a href="/admin/portal" class="text-sm font-semibold text-emerald-700">← Admin console</a><h1 class="mt-4 text-3xl font-bold">Reviewed hotels</h1><p class="mt-1 text-sm text-slate-500">Reviewer ratings, written comments, and earned payouts.</p><div id="list" class="mt-5 space-y-3"></div></main><script>const t=localStorage.getItem('adminToken');if(!t)location='/admin/login';const e=x=>String(x||'—').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));fetch('/api/v1/portal/admin/reviews',{headers:{Authorization:`Bearer ${t}`}}).then(r=>r.json()).then(p=>{if(p.status!=='success')throw Error();document.querySelector('#list').innerHTML=p.data.map(x=>`<article class="rounded-2xl border bg-white p-5"><div class="flex flex-wrap justify-between gap-2"><div><h2 class="font-bold">${e(x.hotel)}</h2><p class="text-sm text-slate-500">${e(x.reviewer)} · ${new Date(x.created_at).toLocaleString('en-KE')}</p></div><b>KES ${(x.reward_cents/100).toLocaleString('en-KE',{minimumFractionDigits:2})}</b></div><p class="mt-3 rounded-xl bg-slate-50 p-3 text-sm">${e(x.comment)}</p><p class="mt-3 text-xs text-slate-500">Cleanliness ${x.ratings.cleanliness}/5 · Service ${x.ratings.service}/5 · Location ${x.ratings.location}/5 · Value ${x.ratings.value}/5 · ${e(x.status)}</p></article>`).join('')||'<p class="rounded-xl bg-white p-4">No reviews yet.</p>'}).catch(()=>location='/admin/login')</script></body></html>
