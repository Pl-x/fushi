<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>Let's Review — Payout requests</title></head>
<body class="bg-gray-50 font-sans"><main class="mx-auto max-w-4xl p-5"><a href="/admin/portal" class="text-sm font-semibold text-emerald-700">← Admin console</a><h1 class="mt-5 text-3xl font-bold">Payout requests</h1><p class="mt-1 text-sm text-gray-500">Approvals create a KES M-Pesa transfer. Marked paid only after Paystack confirms it.</p><p id="message" class="mt-3 text-sm font-medium" aria-live="polite"></p><div id="list" class="mt-5 space-y-3"></div></main>
<script>
const token=localStorage.getItem('adminToken');if(!token)location='/admin/login';const headers={Authorization:`Bearer ${token}`},list=document.querySelector('#list'),message=document.querySelector('#message'),kes=value=>`KES ${(value/100).toLocaleString('en-KE',{minimumFractionDigits:2})}`;
const tell=(text,error=false)=>{message.textContent=text;message.className=`mt-3 text-sm font-medium ${error?'text-red-600':'text-emerald-700'}`};
const load=async()=>{const response=await fetch('/api/v1/portal/admin/payout-requests',{headers});const payload=await response.json();list.innerHTML=(payload.data||[]).map(x=>`<article class="rounded-2xl border bg-white p-4"><div class="flex justify-between gap-3"><div><b>${x.reviewer}</b><p class="text-sm text-gray-500">${x.phone_number||'No payout phone'} · ${kes(x.amount_cents)}</p>${x.transfer_reference?`<p class="mt-1 text-xs text-gray-500">${x.transfer_reference}</p>`:''}</div><span class="text-sm font-semibold">${x.status}</span></div>${x.status==='PENDING'?`<div class="mt-3 flex gap-2"><button onclick="review(${x.id},'approve')" class="rounded-lg bg-emerald-600 px-3 py-2 text-sm text-white">Initiate M-Pesa transfer</button><button onclick="review(${x.id},'decline')" class="rounded-lg border px-3 py-2 text-sm">Decline</button></div>`:''}${x.status==='OTP_REQUIRED'?`<div class="mt-3 flex gap-2"><input id="otp-${x.id}" inputmode="numeric" autocomplete="one-time-code" placeholder="Paystack OTP" class="min-w-0 rounded-lg border px-3 py-2 text-sm"><button onclick="finalize(${x.id})" class="rounded-lg bg-gray-900 px-3 py-2 text-sm text-white">Confirm OTP</button></div>`:''}</article>`).join('')||'<p class="rounded-xl bg-white p-4 text-gray-500">No payout requests.</p>'};
window.review=async(id,action)=>{const response=await fetch(`/api/v1/portal/admin/payout-requests/${id}`,{method:'PATCH',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({action})});const payload=await response.json();tell(payload.message||`Payout ${action}d.`,payload.status!=='success');load()};
window.finalize=async id=>{const otp=document.querySelector(`#otp-${id}`).value.trim();const response=await fetch(`/api/v1/portal/admin/payout-requests/${id}/finalize`,{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({otp})});const payload=await response.json();tell(payload.message||'OTP could not be confirmed.',payload.status!=='success');load()};load();
</script></body></html>
