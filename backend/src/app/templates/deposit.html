<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>Let's Review — Deposit credits</title></head><body class="bg-gray-50 font-sans"><main class="mx-auto max-w-md p-5"><a href="/profile" class="text-sm font-semibold text-emerald-700">← Profile</a><h1 class="mt-6 text-3xl font-bold">Deposit review credits</h1><p class="mt-2 text-sm text-gray-500">KES 1 buys 0.01 credit. Your first default review needs 10.54 credits, so deposit KES 1,054. Credits are added only after Paystack confirms payment.</p><form id="form" class="mt-6 space-y-4 rounded-2xl border bg-white p-5"><label class="block text-sm font-semibold">Amount (KES)<input name="amount" type="number" min="1" value="1054" class="mt-1 w-full rounded-xl border p-3"></label><button class="w-full rounded-xl bg-gray-900 p-3 font-semibold text-white">Continue to Paystack</button><p id="message" class="text-sm text-red-600"></p></form></main><script>const t=localStorage.getItem('pinkToken'),f=document.querySelector('#form');if(!t)location='/signin';f.onsubmit=async e=>{e.preventDefault();const me=JSON.parse(localStorage.getItem('pinkReviewer'));const r=await fetch('/api/v1/paystack/initialize',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${t}`},body:JSON.stringify({email:me.email,amount:Number(f.amount.value)*100,currency:'KES',purpose:'CREDIT_DEPOSIT',description:'Review credit deposit',callback_url:location.origin+'/dashboard'})});const p=await r.json();if(p.status==='success')location.href=p.data.authorization_url;else document.querySelector('#message').textContent=p.message}</script></body></html>
