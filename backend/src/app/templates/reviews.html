<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>Let's Review — Reviews</title></head><body class="bg-gray-50 font-sans"><main class="mx-auto max-w-md p-5"><a href="/dashboard" class="text-sm font-semibold text-emerald-700">← Dashboard</a><h1 class="mt-6 text-3xl font-bold">Your reviews</h1><div id="list" class="mt-5 space-y-3"></div></main><script>const t=localStorage.getItem('pinkToken');if(!t)location='/signin';fetch('/api/v1/portal/me',{headers:{Authorization:`Bearer ${t}`}}).then(r=>r.json()).then(p=>document.querySelector('#list').innerHTML=p.data.reviews.map(x=>`<article class="rounded-2xl border bg-white p-4"><b>${x.hotel}</b><p class="mt-1 text-sm text-gray-500">${new Date(x.created_at).toLocaleDateString()} · ${x.status}</p><p class="mt-2 font-semibold text-emerald-700">$${(x.reward_cents/100).toFixed(2)}</p></article>`).join('')||'<p class="rounded-xl bg-white p-4 text-gray-500">No reviews yet. Browse hotels to get started.</p>')</script></body></html>
