<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Let's Review — Admin login</title>
</head>
<body class="bg-gray-50 font-sans">
  <main class="mx-auto flex min-h-screen max-w-md items-center p-5">
    <form id="form" class="w-full rounded-2xl border bg-white p-6 shadow-sm">
      <p class="text-xs font-bold uppercase tracking-widest text-emerald-700">Restricted area</p>
      <h1 class="mt-2 text-3xl font-bold">Admin sign in</h1>
      <input name="email" type="email" required autocomplete="username" placeholder="Administrator email" class="mt-6 w-full rounded-xl border p-3">
      <div class="relative mt-3">
        <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Admin password" class="w-full rounded-xl border p-3 pr-12">
        <button id="toggle-password" type="button" aria-label="Show password" aria-pressed="false" class="absolute inset-y-0 right-0 flex w-12 items-center justify-center text-gray-500 hover:text-gray-900">
          <svg id="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
          <svg id="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="hidden h-5 w-5" aria-hidden="true"><path d="m3 3 18 18"/><path d="M10.6 6.2A10.8 10.8 0 0 1 12 6c6.5 0 10 6 10 6a18 18 0 0 1-3.3 3.8M6.2 6.2C3.5 8.1 2 12 2 12s3.5 6 10 6a9.9 9.9 0 0 0 3.2-.5"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
        </button>
      </div>
      <button class="mt-5 w-full rounded-xl bg-gray-900 p-3 font-semibold text-white">Sign in to admin</button>
      <p id="message" class="mt-3 text-sm text-red-600"></p>
    </form>
  </main>
  <script>
    const form = document.querySelector('#form');
    const password = document.querySelector('#password');
    const toggle = document.querySelector('#toggle-password');
    const openEye = document.querySelector('#eye-open');
    const closedEye = document.querySelector('#eye-closed');

    toggle.onclick = () => {
      const visible = password.type === 'text';
      password.type = visible ? 'password' : 'text';
      toggle.setAttribute('aria-label', visible ? 'Show password' : 'Hide password');
      toggle.setAttribute('aria-pressed', String(!visible));
      openEye.classList.toggle('hidden', !visible);
      closedEye.classList.toggle('hidden', visible);
    };

    form.onsubmit = async event => {
      event.preventDefault();
      const response = await fetch('/api/v1/portal/admin/login', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(Object.fromEntries(new FormData(form)))
      });
      const payload = await response.json();
      if (payload.status === 'success') {
        localStorage.setItem('adminToken', payload.data.token);
        location = '/admin/portal';
      } else {
        document.querySelector('#message').textContent = payload.message;
      }
    };
  </script>
</body>
</html>
