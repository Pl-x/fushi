<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Let's Review — Transactions</title></head><body class="bg-slate-50 text-slate-900"><main class="mx-auto max-w-6xl p-5"><div class="flex justify-between"><div><a href="/admin/portal" class="text-sm font-semibold text-emerald-700">← Admin console</a><h1 class="mt-3 text-3xl font-bold">Transactions</h1><p class="text-sm text-slate-500">All deposits, reviewer payouts, and refunds.</p></div><button id="logout" class="h-10 rounded-lg border px-3 font-semibold">Log out</button></div><p id="message" class="mt-4"></p><div class="mt-5 overflow-x-auto rounded-2xl border bg-white"><table class="w-full text-left text-sm"><thead class="bg-slate-100"><tr><th class="p-3">Type</th><th class="p-3">Reference</th><th class="p-3">Amount</th><th class="p-3">Status</th><th class="p-3">Date</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const t=localStorage.getItem('adminToken');if(!t)location='/admin/login';const esc=x=>String(x||'—').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));document.querySelector('#logout').onclick=()=>{localStorage.removeItem('adminToken');location='/admin/login'};fetch('/api/v1/portal/admin/transactions',{headers:{Authorization:`Bearer ${t}`}}).then(r=>r.json()).then(p=>{if(p.status!=='success')throw Error();document.querySelector('#rows').innerHTML=p.data.map(x=>`<tr class="border-t"><td class="p-3 font-semibold">${esc(x.type)}</td><td class="p-3">${esc(x.reference||x.paystack_reference||x.refund_reference)}</td><td class="p-3">KES ${((Number(x.amount)||0)/100).toLocaleString('en-KE',{minimumFractionDigits:2})}</td><td class="p-3">${esc(x.status)}</td><td class="p-3">${x.created_at?new Date(x.created_at).toLocaleString('en-KE'):'—'}</td></tr>`).join('')||'<tr><td class="p-4" colspan="5">No transactions yet.</td></tr>'}).catch(()=>location='/admin/login')</script></body></html>
