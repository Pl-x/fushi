[pytest]
# Pytest configuration for Payment Gateway tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Minimum version
minversion = 7.0

# Add options
addopts =
    # Verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    -l
    # Coverage report
    --cov=src/app
    --cov-report=html
    --cov-report=term-missing
    # Strict markers
    --strict-markers
    # Show warnings
    -W default
    # Fail on first error (useful for debugging)
    # -x
    # Stop after N failures
    # --maxfail=5
    # Run tests in parallel (requires pytest-xdist)
    # -n auto

# Markers for categorizing tests
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    auth: Authentication tests
    payment: Payment processing tests
    transfer: Transfer/payout tests
    refund: Refund tests
    model: Database model tests
    api: API endpoint tests
    idempotency: Idempotency tests
    smoke: Smoke tests for quick validation

# Test output format
console_output_style = progress

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning

# Coverage options
[coverage:run]
source = src/app
omit =
    */tests/*
    */venv/*
    */.venv/*
    */migrations/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
